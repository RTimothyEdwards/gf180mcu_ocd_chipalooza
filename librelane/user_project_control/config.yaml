meta:
  version: 2
  flow: Classic
  substituting_steps:
    
    # Allow assignments for por, porb
    Checker.NetlistAssignStatements: null
    
    # For debugging
    +OpenROAD.GeneratePDN: Magic.StreamOut
    
    # Ignore disconnected pins
    Checker.DisconnectedPins: null
    
    # TODO reenable again?
    OpenROAD.IRDropReport: null
    
    # Not needed
    Magic.WriteLef: null
    Odb.CheckDesignAntennaProperties: null
    
    # Magic has no issues with DRC
    # Magic.DRC: null
    
    # Some macros may overlap on purpose
    Checker.IllegalOverlap: null
    
    # NOTE:  KLayout.StreamOut / KLayout.XOR / KLayout.DRC / Netgen.LVS
    # are no longer disabled here.  Nulling a step leaves its Checker
    # behind with nothing to check, which is where the
    #   "The XOR differences metric was not found."
    # message came from.  They are disabled through the flow control
    # variables further down instead, which drop the checkers too.

# Signoff tool selection and flow control
#
# THE IMPORTANT ONE:  the GF PDK sets PRIMARY_GDSII_STREAMOUT_TOOL to
# "klayout", and Magic.StreamOut only registers the GDS view when this is
# "magic" (otherwise it registers MAG_GDS and MAG only).  With KLayout's
# streamout disabled, nothing produced a GDS view at all, so Magic.DRC
# --- which takes DesignFormat.GDS as a REQUIRED input --- aborted before
# running, leaving an empty step directory and an empty error.log.  That
# is why the flow always stopped just short of DRC.
PRIMARY_GDSII_STREAMOUT_TOOL: magic

# KLayout streamout is off, which also switches off KLayout.XOR and
# Checker.XOR (they are gated on the streamouts as well).  Note this
# means the magic-vs-klayout GDS cross-check is not being run;  see the
# README if it is ever worth turning back on.
RUN_KLAYOUT_STREAMOUT: false
RUN_KLAYOUT_XOR: false

# KLayout DRC and LVS are run manually from validate/.  Disabling them
# by flow control variable also drops Checker.KLayoutDRC and Checker.LVS.
RUN_KLAYOUT_DRC: false
RUN_LVS: false

DESIGN_NAME: user_project_control
VERILOG_FILES:
- dir::../../verilog/rtl/synth_defs.v
- dir::../../verilog/rtl/user_project_control.v
- dir::../../verilog/rtl/user_project_control_base.v

DEDUPLICATE_CORNERS: true

# Use the GF CMOS5L standard cell library
STD_CELL_LIBRARY: gf180mcu_as_sc_mcu7t3v3

# Technology libs
LIB:
  "*_tt_025C_3v30":
    - pdk_dir::libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__tt_025C_3v30.lib

  "*_ss_125C_3v00":
    - pdk_dir::libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ss_125C_3v00.lib

  # NOTE the key is 3v60, not 3p60.  These keys are globs matched against
  # the STA corner names below, so a key that does not match simply means
  # no standard cell library is loaded for that corner.  Nothing warns:
  # every cell silently becomes a black box, and the first symptom is
  # set_driving_cell in constraints.sdc failing with
  #   'gf180mcu_as_sc_mcu7t3v3__buff_4' not found
  # which points at the SDC rather than at this file.
  "*_ff_n40C_3v60":
    - pdk_dir::libs.ref/gf180mcu_as_sc_mcu7t3v3/lib/gf180mcu_as_sc_mcu7t3v3__ff_n40C_3v60.lib


# Corners
STA_CORNERS:
  - nom_tt_025C_3v30
  - nom_ss_125C_3v00
  - nom_ff_n40C_3v60

CTS_CLK_BUFFERS:
  - "gf180mcu_as_sc_mcu7t3v3__clkbuff_12"
  - "gf180mcu_as_sc_mcu7t3v3__clkbuff_8"
  - "gf180mcu_as_sc_mcu7t3v3__clkbuff_4"

DEFAULT_CORNER: nom_tt_025C_3v30

# Magic streamout: don't blackbox macros
MAGIC_MACRO_STD_CELL_SOURCE: PDK

# Don't short top-level pins
MAGIC_EXT_SHORT_RESISTOR: true

# IGNORE_DISCONNECTED_MODULES:
#     - manual_routing

# Prevent porb_h mangling
SYNTH_DIRECT_WIRE_BUFFERING: False
SYNTH_WRITE_NOATTR: False

# Ignores don't touch directive
PL_TIME_DRIVEN: False

# Clock
CLOCK_NET: clk
CLOCK_PORT: clk
CLOCK_PERIOD: 15

# SDC
# NOTE:  FALLBACK_SDC (the deprecated FALLBACK_SDC_FILE) only ever
# constrains the first entry of CLOCK_PORT, which is why the templated
# base.sdc could not describe this block.  Setting the per-step files
# explicitly instead.  base.sdc is now unused and can be deleted.
PNR_SDC_FILE: dir::constraints.sdc
SIGNOFF_SDC_FILE: dir::constraints.sdc

# CTS
CTS_OBSTRUCTION_AWARE: true
CTS_CLK_MAX_WIRE_LENGTH: 1200
CTS_SINK_CLUSTERING_SIZE: 25 # default 25
CTS_SINK_CLUSTERING_MAX_DIAMETER: 60 # default 50

# Routing
GRT_ALLOW_CONGESTION: true
RT_CLOCK_MAX_LAYER: Metal4

# The gf180mcu routable stack is Metal1..Metal4 plus TopMetal1 (which
# magic calls "metal5"/m5).  TopMetal1 has a 3.28 um pitch and 1.64 um
# width, so it is of no use for signal routing in a 35 um tall block:
# the previous run placed exactly zero TopMetal1 signal wires in it.
# Capping the router at Metal4 keeps TopMetal1 entirely free for the
# chip-level power distribution that runs over this block.
RT_MAX_LAYER: Metal4

# Resizer
# RSZ_DONT_TOUCH_RX: porb_l|por_l
DESIGN_REPAIR_BUFFER_INPUT_PORTS: false
DESIGN_REPAIR_BUFFER_OUTPUT_PORTS: false

# Overfix hold violations
PL_RESIZER_HOLD_SLACK_MARGIN: 0.2

VDD_NETS:
- vddd

GND_NETS:
- vssd

PDN_CORE_RING: false

# Keep the block PDN off TopMetal1.  With PDN_MULTILAYER false, pdngen
# builds Metal1 follow-pin rails plus Metal4 vertical straps and stops
# there, instead of adding the TopMetal1 horizontal straps that had to
# be deleted by hand after the previous run.
PDN_MULTILAYER: false

# FP_PDN_CFG: dir::pdn_cfg.tcl

# FP_PDN_VWIDTH: 2.0
# FP_PDN_HWIDTH: 5.0
# FP_PDN_VSPACING: 1.7
# FP_PDN_HSPACING: 1.7
# FP_PDN_VPITCH: 55
# FP_PDN_HPITCH: 70

# FP_PDN_CORE_RING: true
# FP_PDN_CORE_RING_VWIDTH: 8
# FP_PDN_CORE_RING_HWIDTH: 8

# FP_PDN_CORE_RING_VOFFSET: 2
# FP_PDN_CORE_RING_HOFFSET: 2

# Floorplanning
FP_SIZING: absolute

# 205 sites x 14 rows = 5207.3 um2 of core, for ~2940 um2 of cells
# (56% utilization).  The 0.48 um site / 3.78 um row grid is anchored at
# die (0,0), so the usable row area is NOT (urx-llx)*(ury-lly):  rows run
# y = 3.78 .. 56.70 and sites x = 5.06 .. 101.76.  Check both when
# changing these numbers --- at 115x35 the rows only reached y = 30.24
# inside a core ending at 32, giving 2870 um2 against 2938 um2 of cells,
# which is why placement could not be legalized after CTS.
DIE_AREA: [ 0.00, 0.00, 120.00, 70.00 ]
CORE_AREA: [ 3.00, 3.00, 117.00, 67.00 ]

FP_DEF_TEMPLATE: dir::../../def/user_project_control.def
FP_TEMPLATE_MATCH_MODE: permissive
#FP_TEMPLATE_COPY_POWER_PINS: True

# Kept above the ~56% actual utilization so the global placer has room
# to spread rather than packing to the target.
PL_TARGET_DENSITY_PCT: 65

# FP_OBSTRUCTIONS:
## (none)

# Obstructions
#
# IMPORTANT:  Odb.ApplyDEFTemplate only relocates pins and reads the die
# area out of FP_DEF_TEMPLATE.  It does NOT import the BLOCKAGES section,
# so the obsm* shapes painted by scripts/run_gen_ctrl_def.tcl have no
# effect on the flow and have to be restated here.  Keep the two in step
# when the template is regenerated.
#
# Layer names here are LEF names.  magic's "m4"/metal4 is Metal4;  its
# "m5"/metal5 is TopMetal1.
#
# PDN and routing obstructions to be added if needed.

# PDN_OBSTRUCTIONS:

# ROUTING_OBSTRUCTIONS:

# NOTE:  run_gen_ctrl_def.tcl also paints 1 um obsm1/obsm2/obsm3/obsm4
# strips along all four die edges, over the pins.  Those are NOT
# restated here on purpose:  the pin shapes themselves are only 2 um
# long, so a 1 um routing blockage on the same layer would cover half of
# every pin and could make them unreachable.  The 3 um CORE_AREA margin
# already keeps placement and most routing off the die edge.  If edge
# blockages do turn out to be needed at chip level, they should be made
# narrower than the pin overhang first.

# Magic: Use GDS views (no DRC issues)
MAGIC_DRC_USE_GDS: True

# Allow top ports to be non-unique (because power names are duplicated)
MAGIC_EXT_UNIQUE: notopports

MACROS:

PDN_MACRO_CONNECTIONS:

